<header class="header">
  <!-- Left: the pages. routerLinkActive adds the "active" class (black) to the page you are on -->
  <nav class="nav">
    <a class="nav-item" routerLink="/open-packs" routerLinkActive="active">Open packs</a>
    <a class="nav-item" routerLink="/home" routerLinkActive="active">Collection</a>
  </nav>

  <!-- Right: account buttons, depending on if you are logged in -->
  <div class="account">
    @if (isLoggedIn()) {
      <button type="button" class="text-button" (click)="clearSavedData()">Clear saved data</button>
      <button type="button" class="nav-item" (click)="logOut()">Log out</button>
    } @else {
      <a class="nav-item active" routerLink="/login">Log in</a>
    }
  </div>
</header>
